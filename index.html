              { name:'部署上线', duration:'1-3天', activities:['环境准备','系统部署','数据迁移','上线验证'], deliverables:['部署文档','迁移日志','上线验证记录'] },
              { name:'试运行支持', duration:'2-4周', activities:['日常运行支持','问题监测','性能监控','持续优化'], deliverables:['运行日报','性能报告','试运行总结'] },
              { name:'验收总结', duration:'1周', activities:['验收会议','文档检查','运维移交','知识转移'], deliverables:['项目验收单','项目完成报告','运维文档'] },
              { name:'后期运维', duration:'1年+', activities:['技术支持','系统监控','性能优化','功能更新'], deliverables:['月度运维报告','年度总结报告','升级方案'] }
            ]}
          }
        };
        const parks = DATA.parks, phases = DATA.phases;
        const phaseKeys = ['presales','midsales','delivery'];
        const PURPLE='7C3AED', PINK='EC4899', DARK='1E1B4B', GRAY='64748B';

        // type -> [显示名, 扩展名]
        const genTypes = [['proposal','📄 方案文档','docx'],['ppt','📊 演示文稿','pptx'],['plan','📅 实施计划','xlsx'],['package','📦 完整包','zip']];
        let selectedType = 'proposal';

        function scrollToSection(id){ document.getElementById(id).scrollIntoView({behavior:'smooth'}); }
        function nowDate(){ return new Date().toLocaleDateString('zh-CN'); }

        function renderParks(){
            document.getElementById('parkGrid').innerHTML = parks.map(p=>`
                <div class="card-hover bg-gradient-to-br from-slate-800 to-slate-900 border border-purple-500/20 rounded-xl p-6 cursor-pointer" onclick="showPark('${p.id}')">
                    <div class="text-5xl mb-4">${p.icon}</div>
                    <h3 class="text-xl font-bold mb-2">${p.name}</h3>
                    <p class="text-sm text-gray-400 mb-4">${p.desc}</p>
                    <div class="flex justify-between text-xs text-gray-500"><span>📁 ${p.res}个资源</span><span>✅ ${p.tag}</span></div>
                </div>`).join('');
            document.getElementById('genPark').innerHTML = parks.map(p=>`<option value="${p.id}">${p.icon} ${p.name}</option>`).join('');
        }
        function renderPhases(){
            const meta = { presales:['📋','purple'], midsales:['🔨','blue'], delivery:['🚀','green'] };
            document.getElementById('phaseGrid').innerHTML = phaseKeys.map(k=>{
                const ph = phases[k], ic = meta[k][0], color = meta[k][1];
                return `<div class="bg-${color}-500/10 border border-${color}-500/30 rounded-xl p-8">
                    <div class="text-3xl mb-4">${ic}</div>
                    <h3 class="text-2xl font-bold mb-6 text-${color}-300">${ph.name}</h3>
                    <div class="space-y-4">${ph.items.map(s=>`<div class="timeline-item"><div class="font-semibold">${s.name}</div><div class="text-xs text-gray-400">${s.duration}</div></div>`).join('')}</div>
                    <div class="mt-8 pt-6 border-t border-${color}-500/20"><div class="text-sm font-semibold mb-3">关键交付物:</div><ul class="text-xs text-gray-400 space-y-1">${ph.items.map(s=>`<li>✓ ${s.deliverables[0]}</li>`).join('')}</ul></div>
                </div>`;
            }).join('');
        }
        function renderGenTypes(){
            document.getElementById('genType').innerHTML = genTypes.map(t=>`<button data-t="${t[0]}" onclick="pickType('${t[0]}')" class="gt border border-slate-600 rounded-lg px-3 py-3 text-sm transition ${t[0]===selectedType?'border-purple-500 bg-purple-500/10':''}">${t[1]}</button>`).join('');
        }
        function pickType(t){ selectedType=t; renderGenTypes(); }
        function showPark(id){
            const p = parks.find(x=>x.id===id);
            document.getElementById('modalContent').innerHTML = `
                <div class="text-6xl mb-4 text-center">${p.icon}</div>
                <h3 class="text-2xl font-bold mb-2 text-center">${p.name}</h3>
                <p class="text-gray-400 text-center mb-6">${p.desc}</p>
                <div class="grid grid-cols-2 gap-3 mb-4 text-sm"><div class="bg-slate-900 rounded-lg p-3 text-center">📁 ${p.res} 个资源</div><div class="bg-slate-900 rounded-lg p-3 text-center">✅ ${p.tag}</div></div>
                <div class="text-sm font-semibold mb-2">核心功能模块:</div>
                <div class="flex flex-wrap gap-2 mb-4">${p.modules.map(m=>`<span class="bg-purple-500/20 text-purple-300 px-3 py-1 rounded-full text-xs">${m}</span>`).join('')}</div>
                <div class="text-sm font-semibold mb-2">核心价值:</div>
                <ul class="text-xs text-gray-300 space-y-1">${p.value.map(v=>`<li>✓ ${v}</li>`).join('')}</ul>`;
            document.getElementById('parkModal').classList.add('active');
        }

        // ---------- 浏览器端真实文档生成 ----------
        function downloadBlob(blob, fileName){
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = fileName;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(()=>URL.revokeObjectURL(url), 4000);
        }

        async function genDocxBlob(park, version){
            const d = docx;
            const A = d.AlignmentType, H = d.HeadingLevel;
            const h = (text, level)=> new d.Paragraph({ text, heading: level, spacing:{ before:240, after:120 } });
            const p = (text, o={})=> new d.Paragraph({ children:[new d.TextRun({ text, size:o.size||22, bold:!!o.bold, color:o.color })], spacing:{ after:o.after||80 }, alignment:o.align });
            const bullet = (text)=> new d.Paragraph({ text, bullet:{ level:0 }, spacing:{ after:40 } });
            const c = [];
            c.push(new d.Paragraph({ text:'', spacing:{ before:1200 } }));
            c.push(p(`${park.icon}  ${park.name}`, { bold:true, size:56, align:A.CENTER, after:200 }));
            c.push(p('数字化解决方案', { bold:true, size:40, color:PURPLE, align:A.CENTER, after:600 }));
            c.push(p(park.desc, { size:24, align:A.CENTER, after:200 }));
            c.push(p(`版本：${version}`, { size:22, align:A.CENTER }));
            c.push(p(`生成日期：${nowDate()}`, { size:22, align:A.CENTER, after:400 }));
            c.push(new d.Paragraph({ text:'', pageBreakBefore:true }));
            c.push(h('一、项目概述', H.HEADING_1));
            c.push(p(`本方案面向${park.name}场景，围绕"${park.desc}"的核心目标，结合行业最佳实践与数字孪生、物联网、大数据、人工智能等先进技术，为客户打造一套完整、可落地的数字化解决方案。`));
            c.push(h('二、需求与痛点分析', H.HEADING_1));
            c.push(p('当前客户在业务运营中普遍面临以下挑战：', { bold:true }));
            park.pains.forEach(x=>c.push(bullet(x)));
            c.push(h('三、建设目标与价值', H.HEADING_1));
            c.push(p('通过本方案的实施，将为客户带来以下核心价值：', { bold:true }));
            park.value.forEach(x=>c.push(bullet(x)));
            c.push(h('四、核心功能模块', H.HEADING_1));
            park.modules.forEach((m,i)=>{
                c.push(h(`4.${i+1}  ${m}`, H.HEADING_2));
                c.push(p(`${m}是本方案的核心组成部分，提供完善的功能支撑，满足${park.name}在该领域的业务需求，实现数据互通、流程优化与智能决策。`));
            });
            c.push(h('五、技术架构', H.HEADING_1));
            c.push(p('本方案采用分层架构设计，自下而上包括：'));
            ['感知层：通过物联网设备、传感器实现全域数据采集','网络层：基于5G/光纤等构建高速稳定的数据传输通道','平台层：提供数据中台、AI中台、统一身份认证等基础能力','应用层：面向业务场景的各功能模块与可视化大屏','展现层：PC端、移动端、大屏多终端统一呈现'].forEach(x=>c.push(bullet(x)));
            c.push(h('六、实施计划', H.HEADING_1));
            c.push(p('项目实施分为售前、售中、交付三大阶段，各阶段关键环节与交付物如下：'));
            phaseKeys.forEach((key,idx)=>{
                const ph = phases[key];
                c.push(h(`6.${idx+1}  ${ph.name}`, H.HEADING_2));
                c.push(p(ph.desc, { color:'666666' }));
                ph.items.forEach(it=>{
                    c.push(p(`${it.name}（${it.duration}）`, { bold:true, after:40 }));
                    c.push(p('主要活动：' + it.activities.join('、'), { size:20, after:20 }));
                    c.push(p('交付物：' + it.deliverables.join('、'), { size:20, color:PURPLE }));
                });
            });
            c.push(h('七、服务保障', H.HEADING_1));
            ['7×24小时技术支持响应','专属项目经理全程跟踪','定期巡检与健康度评估','持续的功能迭代与升级','完善的培训与知识转移体系'].forEach(x=>c.push(bullet(x)));
            c.push(new d.Paragraph({ text:'', spacing:{ before:400 } }));
            c.push(p('—— 本方案为' + version + '，最终以双方确认的合同为准 ——', { size:18, color:'999999', align:A.CENTER }));
            const doc = new d.Document({ creator:'园区Skill平台', title:`${park.name}数字化解决方案`, sections:[{ children:c }] });
            return await d.Packer.toBlob(doc);
        }

        async function genPptxBlob(park, version){
            const pres = new PptxGenJS();
            pres.author='园区Skill平台'; pres.title=`${park.name}解决方案`; pres.layout='LAYOUT_WIDE';
            let s = pres.addSlide(); s.background={ color:DARK };
            s.addText(park.icon,{ x:0.5,y:1.6,w:12.3,h:1.5,fontSize:80,align:'center',color:'FFFFFF' });
            s.addText(park.name,{ x:0.5,y:3.0,w:12.3,h:1,fontSize:44,bold:true,align:'center',color:'FFFFFF' });
            s.addText('数字化解决方案',{ x:0.5,y:4.0,w:12.3,h:0.8,fontSize:28,align:'center',color:'A78BFA' });
            s.addText(park.desc,{ x:0.5,y:4.9,w:12.3,h:0.5,fontSize:16,align:'center',color:'CBD5E1' });
            s.addText(`${version}  ·  ${nowDate()}`,{ x:0.5,y:6.4,w:12.3,h:0.4,fontSize:12,align:'center',color:GRAY });
            s = pres.addSlide();
            s.addText('需求与痛点分析',{ x:0.5,y:0.4,w:12.3,h:0.8,fontSize:32,bold:true,color:PURPLE });
            park.pains.forEach((x,i)=> s.addText([{text:'⚠ ',options:{color:PINK}},{text:x,options:{color:'334155'}}],{ x:0.8,y:1.5+i*1.0,w:11.5,h:0.8,fontSize:18,valign:'middle' }));
            s = pres.addSlide();
            s.addText('建设目标与核心价值',{ x:0.5,y:0.4,w:12.3,h:0.8,fontSize:32,bold:true,color:PURPLE });
            park.value.forEach((x,i)=> s.addText([{text:'✓ ',options:{color:'22C55E'}},{text:x,options:{color:'334155'}}],{ x:0.8,y:1.5+i*1.0,w:11.5,h:0.8,fontSize:18,valign:'middle' }));
            s = pres.addSlide();
            s.addText('核心功能模块',{ x:0.5,y:0.4,w:12.3,h:0.8,fontSize:32,bold:true,color:PURPLE });
            const cols=3;
            park.modules.forEach((m,i)=>{
                const cx=0.6+(i%cols)*4.1, cy=1.6+Math.floor(i/cols)*1.7;
                s.addShape(pres.ShapeType.roundRect,{ x:cx,y:cy,w:3.8,h:1.4,fill:{color:'F1F5F9'},line:{color:PURPLE,width:1},rectRadius:0.1 });
                s.addText(m,{ x:cx,y:cy,w:3.8,h:1.4,fontSize:16,bold:true,align:'center',valign:'middle',color:DARK });
            });
            s = pres.addSlide();
            s.addText('技术架构',{ x:0.5,y:0.4,w:12.3,h:0.8,fontSize:32,bold:true,color:PURPLE });
            [['展现层','PC端 · 移动端 · 可视化大屏','A78BFA'],['应用层','各业务功能模块与场景应用','818CF8'],['平台层','数据中台 · AI中台 · 统一认证','60A5FA'],['网络层','5G · 光纤高速数据传输','34D399'],['感知层','物联网设备 · 传感器全域采集','FBBF24']].forEach((l,i)=>{
                s.addShape(pres.ShapeType.roundRect,{ x:2.5,y:1.5+i*1.0,w:8.3,h:0.85,fill:{color:l[2]},rectRadius:0.05 });
                s.addText([{text:l[0]+'  ',options:{bold:true,fontSize:18}},{text:l[1],options:{fontSize:13}}],{ x:2.5,y:1.5+i*1.0,w:8.3,h:0.85,align:'center',valign:'middle',color:'FFFFFF' });
            });
            phaseKeys.forEach(key=>{
                const ph = phases[key]; s = pres.addSlide();
                s.addText(`实施计划 · ${ph.name}`,{ x:0.5,y:0.4,w:12.3,h:0.7,fontSize:30,bold:true,color:PURPLE });
                s.addText(ph.desc,{ x:0.5,y:1.1,w:12.3,h:0.5,fontSize:14,color:GRAY });
                ph.items.forEach((it,i)=>{
                    const y=1.8+i*1.0;
                    s.addText(`${it.name}`,{ x:0.6,y,w:2.2,h:0.9,fontSize:15,bold:true,color:DARK,valign:'middle' });
                    s.addText(it.duration,{ x:0.6,y:y+0.45,w:2.2,h:0.4,fontSize:11,color:PINK });
                    s.addText('交付物：'+it.deliverables.join('、'),{ x:3.0,y,w:9.7,h:0.9,fontSize:13,color:'475569',valign:'middle' });
                });
            });
            s = pres.addSlide();
            s.addText('服务保障',{ x:0.5,y:0.4,w:12.3,h:0.8,fontSize:32,bold:true,color:PURPLE });
            ['7×24小时技术支持响应','专属项目经理全程跟踪','定期巡检与健康度评估','持续功能迭代与升级','完善培训与知识转移'].forEach((x,i)=> s.addText('★ '+x,{ x:0.8,y:1.6+i*0.9,w:11.5,h:0.7,fontSize:18,color:'334155',valign:'middle' }));
            s = pres.addSlide(); s.background={ color:DARK };
            s.addText('谢谢观看',{ x:0.5,y:2.8,w:12.3,h:1,fontSize:44,bold:true,align:'center',color:'FFFFFF' });
            s.addText('园区Skill智能方案生成平台',{ x:0.5,y:4.0,w:12.3,h:0.6,fontSize:18,align:'center',color:'A78BFA' });
            return await pres.write({ outputType:'blob' });
        }

        async function genXlsxBlob(park, version){
            const wb = new ExcelJS.Workbook(); wb.creator='园区Skill平台';
            const ws = wb.addWorksheet('实施计划');
            ws.columns = [
                { header:'阶段', key:'stage', width:14 },
                { header:'环节', key:'phase', width:16 },
                { header:'周期', key:'duration', width:12 },
                { header:'主要活动', key:'activities', width:50 },
                { header:'交付物', key:'deliverables', width:45 }
            ];
            ws.getRow(1).eachCell(cell=>{
                cell.font={ bold:true, color:{argb:'FFFFFFFF'}, size:12 };
                cell.fill={ type:'pattern', pattern:'solid', fgColor:{argb:'FF7C3AED'} };
                cell.alignment={ vertical:'middle', horizontal:'center' };
            });
            ws.spliceRows(1,0,[`${park.icon} ${park.name} 数字化解决方案 - 实施计划（${version}）`]);
            ws.mergeCells('A1:E1');
            const tc = ws.getCell('A1');
            tc.font={ bold:true, size:16, color:{argb:'FF1E1B4B'} };
            tc.alignment={ vertical:'middle', horizontal:'center' };
            ws.getRow(1).height=30;
            const stageColors={ presales:'FFEDE9FE', midsales:'FFDBEAFE', delivery:'FFD1FAE5' };
            phaseKeys.forEach(key=>{
                const ph = phases[key];
                ph.items.forEach((it,idx)=>{
                    const row = ws.addRow({ stage: idx===0?ph.name:'', phase:it.name, duration:it.duration, activities:it.activities.join('、'), deliverables:it.deliverables.join('、') });
                    row.eachCell(cell=>{
                        cell.alignment={ vertical:'middle', wrapText:true };
                        cell.fill={ type:'pattern', pattern:'solid', fgColor:{argb:stageColors[key]} };
                        cell.border={ top:{style:'thin',color:{argb:'FFCBD5E1'}}, bottom:{style:'thin',color:{argb:'FFCBD5E1'}} };
                    });
                    row.getCell('stage').font={ bold:true };
                });
            });
            const buf = await wb.xlsx.writeBuffer();
            return new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        }

        async function generate(){
            const parkId = document.getElementById('genPark').value;
            const p = parks.find(x=>x.id===parkId);
            const ver = document.querySelector('input[name=ver]:checked').value;
            const t = genTypes.find(t=>t[0]===selectedType);
            const typeName = t[1], ext = t[2];
            const r = document.getElementById('genResult');
            const btn = document.getElementById('genBtn');
            btn.disabled = true; btn.classList.add('opacity-60');
            r.innerHTML = `<div class="bg-slate-900 border border-purple-500/30 rounded-lg p-4 text-gray-300 flex items-center gap-3"><span class="spinner"></span> 正在为「${p.name}」生成${typeName}（${ver}）...</div>`;
            try {
                let blob, fileName;
                const base = `${p.name}-${typeName.replace(/^.. /,'')}-${ver}`;
                if (selectedType==='proposal'){ blob = await genDocxBlob(p,ver); fileName = base+'.docx'; }
                else if (selectedType==='ppt'){ blob = await genPptxBlob(p,ver); fileName = base+'.pptx'; }
                else if (selectedType==='plan'){ blob = await genXlsxBlob(p,ver); fileName = base+'.xlsx'; }
                else {
                    const [doc,ppt,xls] = await Promise.all([genDocxBlob(p,ver), genPptxBlob(p,ver), genXlsxBlob(p,ver)]);
                    const zip = new JSZip();
                    zip.file(`${p.name}-解决方案-${ver}.docx`, doc);
                    zip.file(`${p.name}-演示文稿-${ver}.pptx`, ppt);
                    zip.file(`${p.name}-实施计划-${ver}.xlsx`, xls);
                    blob = await zip.generateAsync({ type:'blob' });
                    fileName = `${p.name}-完整方案包-${ver}.zip`;
                }
                downloadBlob(blob, fileName);
                const sizeKB = (blob.size/1024).toFixed(1);
                r.innerHTML = `<div class="bg-green-500/10 border border-green-500/30 rounded-lg p-5">
                    <div class="font-bold text-green-300 mb-3">✅ 生成成功，文件已开始下载！</div>
                    <div class="text-sm text-gray-300 mb-3">${p.icon} ${p.name} · ${ver}</div>
                    <div class="flex items-center justify-between bg-slate-900 rounded-lg px-4 py-2"><span class="text-sm">📄 ${fileName}</span><span class="text-xs text-purple-400">${sizeKB} KB</span></div>
                    <p class="text-xs text-gray-500 mt-3">文件在您的浏览器本地实时生成，数据不会上传到任何服务器。</p>
                </div>`;
            } catch(err){
                r.innerHTML = `<div class="bg-red-500/10 border border-red-500/30 rounded-lg p-5">
                    <div class="font-bold text-red-300 mb-2">❌ 生成失败</div>
                    <div class="text-sm text-gray-300">${err && err.message ? err.message : err}</div>
                    <p class="text-xs text-gray-500 mt-2">请刷新页面后重试（需联网加载文档生成库）。</p>
                </div>`;
                console.error(err);
            } finally {
                btn.disabled = false; btn.classList.remove('opacity-60');
            }
        }
        renderParks(); renderPhases(); renderGenTypes();
    </script>
