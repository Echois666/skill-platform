<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>园区Skill智能方案生成平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-text { background: linear-gradient(135deg, #a78bfa 0%, #f472b6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card-hover { transition: all .3s ease; }
        .card-hover:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(124,58,237,.25); }
        .timeline-item { padding-left: 28px; position: relative; }
        .timeline-item::before { content:''; position:absolute; left:0; top:6px; width:14px; height:14px; border-radius:50%; background:#a78bfa; box-shadow:0 0 0 3px rgba(167,139,250,.3); }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; align-items:center; justify-content:center; padding:1rem; }
        .modal.active { display:flex; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation: spin .8s linear infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-gray-100 min-h-screen">
    <nav class="fixed top-0 w-full z-50 backdrop-blur-md bg-slate-900/80 border-b border-purple-500/20">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3"><span class="text-3xl">🎯</span><span class="text-xl font-bold gradient-text">园区Skill平台</span></div>
            <div class="hidden md:flex gap-6">
                <button onclick="scrollToSection('parks')" class="hover:text-purple-400 transition">园区方案</button>
                <button onclick="scrollToSection('timeline')" class="hover:text-purple-400 transition">三阶段流程</button>
                <button onclick="scrollToSection('generator')" class="hover:text-purple-400 transition">生成工具</button>
            </div>
        </div>
    </nav>

    <header class="pt-28 pb-10 px-4">
        <div class="max-w-6xl mx-auto text-center">
            <h1 class="text-5xl font-bold mb-4 gradient-text">智能方案生成平台</h1>
            <p class="text-xl text-gray-300 mb-3">汇聚15+个园区类型的完整解决方案，助力快速生成专业方案和演示文稿</p>
            <p class="text-sm text-green-400 mb-8">✨ 完整版：一键生成并下载真实的 Word / PPT / Excel 文件</p>
            <div class="flex gap-4 justify-center mb-12">
                <button onclick="scrollToSection('parks')" class="bg-purple-600 hover:bg-purple-700 px-8 py-3 rounded-lg font-semibold transition">浏览所有方案</button>
                <button onclick="scrollToSection('generator')" class="border border-purple-500 hover:bg-purple-500/10 px-8 py-3 rounded-lg font-semibold transition">开始生成</button>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-purple-500/10 border border-purple-500/20 rounded-lg p-6"><div class="text-4xl font-bold text-purple-400">15</div><div class="text-gray-300 mt-2">园区类型</div></div>
                <div class="bg-blue-500/10 border border-blue-500/20 rounded-lg p-6"><div class="text-4xl font-bold text-blue-400">100+</div><div class="text-gray-300 mt-2">资料文件</div></div>
                <div class="bg-green-500/10 border border-green-500/20 rounded-lg p-6"><div class="text-4xl font-bold text-green-400">30+</div><div class="text-gray-300 mt-2">流程环节</div></div>
                <div class="bg-pink-500/10 border border-pink-500/20 rounded-lg p-6"><div class="text-4xl font-bold text-pink-400">50+</div><div class="text-gray-300 mt-2">交付物模板</div></div>
            </div>
        </div>
    </header>

    <section id="parks" class="py-16 px-4">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-4xl font-bold mb-12 text-center gradient-text">园区解决方案库</h2>
            <div id="parkGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </div>
    </section>

    <section id="timeline" class="py-16 px-4 bg-slate-800/40">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-4xl font-bold mb-4 text-center gradient-text">销售全流程管理</h2>
            <p class="text-center text-gray-400 mb-12">售前 → 售中 → 交付，每个环节都有明确的交付物</p>
            <div id="phaseGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </div>
    </section>

    <section id="generator" class="py-16 px-4">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-4xl font-bold mb-12 text-center gradient-text">智能生成工具</h2>
            <div class="bg-slate-800/60 border border-purple-500/20 rounded-2xl p-8">
                <div class="mb-6">
                    <label class="block text-sm font-semibold mb-3">① 描述您的需求（智能解析）</label>
                    <textarea id="genReq" rows="3" placeholder="例如：我们要给某某化工集团建一个化工园区，重点是安全风险预警和应急指挥调度" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-gray-100 resize-none"></textarea>
                    <button id="parseBtn" onclick="parseReq()" class="mt-3 bg-slate-700 hover:bg-purple-600 px-5 py-2 rounded-lg text-sm font-semibold transition">🧠 智能解析需求</button>
                    <div id="parseResult" class="mt-3"></div>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-semibold mb-3">② 选择/确认园区类型</label>
                    <select id="genPark" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-gray-100"></select>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-semibold mb-3">③ 选择生成类型</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="genType"></div>
                </div>
                <div class="mb-8">
                    <label class="block text-sm font-semibold mb-3">④ 选择版本</label>
                    <div class="flex gap-3">
                        <label class="flex-1 cursor-pointer"><input type="radio" name="ver" value="脱敏版" checked class="peer hidden"><div class="border border-slate-600 peer-checked:border-purple-500 peer-checked:bg-purple-500/10 rounded-lg px-4 py-3 text-center transition">🌍 脱敏版（对外）</div></label>
                        <label class="flex-1 cursor-pointer"><input type="radio" name="ver" value="涉密版" class="peer hidden"><div class="border border-slate-600 peer-checked:border-pink-500 peer-checked:bg-pink-500/10 rounded-lg px-4 py-3 text-center transition">🔐 涉密版（内部）</div></label>
                    </div>
                </div>
                <button id="genBtn" onclick="generate()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:opacity-90 px-8 py-4 rounded-lg font-bold text-lg transition">✨ 一键生成并下载</button>
                <div id="genResult" class="mt-6"></div>
            </div>
        </div>
    </section>

    <div id="parkModal" class="modal" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="bg-slate-800 border border-purple-500/30 rounded-2xl p-8 max-w-lg w-full">
            <div id="modalContent"></div>
            <button onclick="document.getElementById('parkModal').classList.remove('active')" class="mt-6 w-full bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg transition">关闭</button>
        </div>
    </div>

    <footer class="py-10 px-4 border-t border-slate-700 text-center text-gray-500">
        <p>🎯 园区Skill智能方案生成平台 v2.0.0 · 15个园区 · 100+资源 · 30+环节 · 50+交付物</p>
        <p class="text-xs mt-2">完整版后端：真实 Word/PPT/Excel 文档生成</p>
    </footer>

    <script>
        const parks = [
            {id:'smart-campus',icon:'🏫',name:'智慧校园',desc:'校园数字化全方位解决方案',res:7,tag:'涉密版',modules:['一卡通','教学管理','学生管理','后勤管理','数据分析']},
            {id:'smart-hospital',icon:'🏥',name:'智慧医院',desc:'医疗信息系统和管理方案',res:8,tag:'涉密版',modules:['电子病历','挂号预约','医学影像','药房管理','质量管理']},
            {id:'smart-park',icon:'🏢',name:'智慧园区',desc:'园区运营和管理平台',res:8,tag:'视频案例',modules:['综合管理','企业服务','产业分析','智能运营']},
            {id:'smart-scenic',icon:'🎢',name:'智慧景区',desc:'景区游客服务和管理',res:7,tag:'脱敏版',modules:['游客体验','景区管理','智能导览','数据分析']},
            {id:'smart-building',icon:'🏗️',name:'智慧建筑',desc:'楼宇智能化管理系统',res:7,tag:'涉密版',modules:['楼宇自控','能耗管理','安全管理','舒适体验']},
            {id:'smart-logistics',icon:'🚚',name:'智慧物流',desc:'仓储运输配送全链条',res:9,tag:'涉密版',modules:['仓储管理','运输追踪','配送优化','成本控制']},
            {id:'smart-rural',icon:'🌾',name:'智慧乡村',desc:'农业和乡村振兴方案',res:4,tag:'脱敏版',modules:['农业生产','乡村治理','产业发展','生活服务']},
            {id:'smart-forestry',icon:'🌲',name:'智慧林业',desc:'生态保护和资源管理',res:4,tag:'脱敏版',modules:['生态保护','资源管理','防火预警','数据分析']},
            {id:'carbon-park',icon:'♻️',name:'低碳园区',desc:'双碳和碳中和支持',res:7,tag:'涉密版',modules:['碳排放管理','能源优化','绿色发展','双碳目标']},
            {id:'chemical-park',icon:'🏭',name:'化工园区',desc:'安全环保专业管理',res:7,tag:'涉密版',modules:['安全管理','环保监测','应急预案','产业协同']},
            {id:'smart-venue',icon:'🎭',name:'智慧场馆',desc:'会议场馆运营管理',res:6,tag:'涉密版',modules:['会议管理','观众体验','运营管理','数据分析']},
            {id:'smart-city',icon:'🌃',name:'智慧城市',desc:'数字孪生和CIM平台',res:4,tag:'脱敏版',modules:['数字孪生','城市治理','产业发展','居民服务']},
            {id:'smart-realestate',icon:'🏘️',name:'智慧地产',desc:'地产全生命周期管理',res:2,tag:'涉密版',modules:['项目管理','销售管理','物业管理','客户服务']},
            {id:'smart-park-public',icon:'🌳',name:'智慧公园',desc:'生态保护和访客管理',res:2,tag:'脱敏版',modules:['生态保护','访客管理','设施管理','数据分析']},
            {id:'campus-construction',icon:'🎓',name:'校园建设方案',desc:'校园建设专项方案',res:3,tag:'脱敏版',modules:['基础设施','教育系统','管理平台','一体化方案']}
        ];
        const phases = [
            {icon:'📋',name:'售前阶段',color:'purple',steps:[['需求调研','1-2周'],['方案设计','2-3周'],['商务洽谈','1-2周'],['签约启动','3-5天']],deliv:['需求分析报告','解决方案说明书','商务提案','合同文件']},
            {icon:'🔨',name:'售中阶段',color:'blue',steps:[['项目启动','1周'],['详细设计','2-4周'],['开发集成','4-8周'],['测试优化','2-4周'],['培训文档','1-2周']],deliv:['项目计划书','详细设计文档','测试报告','培训手册']},
            {icon:'🚀',name:'交付阶段',color:'green',steps:[['上线准备','1周'],['部署上线','1-3天'],['试运行支持','2-4周'],['验收总结','1周'],['运维优化','1年+']],deliv:['部署文档','验收报告','运维手册','服务计划']}
        ];
        // type -> [显示名, 后端endpoint, 扩展名]
        const genTypes = [
            ['proposal','📄 方案文档','solution','docx'],
            ['ppt','📊 演示文稿','ppt','pptx'],
            ['plan','📅 实施计划','plan','xlsx'],
            ['package','📦 完整包','complete-package','zip']
        ];
        let selectedType = 'proposal';

        function scrollToSection(id){ document.getElementById(id).scrollIntoView({behavior:'smooth'}); }

        function renderParks(){
            document.getElementById('parkGrid').innerHTML = parks.map(p=>`
                <div class="card-hover bg-gradient-to-br from-slate-800 to-slate-900 border border-purple-500/20 rounded-xl p-6 cursor-pointer" onclick="showPark('${p.id}')">
                    <div class="text-5xl mb-4">${p.icon}</div>
                    <h3 class="text-xl font-bold mb-2">${p.name}</h3>
                    <p class="text-sm text-gray-400 mb-4">${p.desc}</p>
                    <div class="flex justify-between text-xs text-gray-500"><span>📁 ${p.res}个资源</span><span>✅ ${p.tag}</span></div>
                </div>`).join('');
            document.getElementById('genPark').innerHTML = parks.map(p=>`<option value="${p.id}">${p.icon} ${p.name}</option>`).join('');
        }
        function renderPhases(){
            document.getElementById('phaseGrid').innerHTML = phases.map(ph=>`
                <div class="bg-${ph.color}-500/10 border border-${ph.color}-500/30 rounded-xl p-8">
                    <div class="text-3xl mb-4">${ph.icon}</div>
                    <h3 class="text-2xl font-bold mb-6 text-${ph.color}-300">${ph.name}</h3>
                    <div class="space-y-4">${ph.steps.map(s=>`<div class="timeline-item"><div class="font-semibold">${s[0]}</div><div class="text-xs text-gray-400">${s[1]}</div></div>`).join('')}</div>
                    <div class="mt-8 pt-6 border-t border-${ph.color}-500/20"><div class="text-sm font-semibold mb-3">交付物:</div><ul class="text-xs text-gray-400 space-y-1">${ph.deliv.map(d=>`<li>✓ ${d}</li>`).join('')}</ul></div>
                </div>`).join('');
        }
        function renderGenTypes(){
            document.getElementById('genType').innerHTML = genTypes.map(t=>`<button data-t="${t[0]}" onclick="pickType('${t[0]}')" class="gt border border-slate-600 rounded-lg px-3 py-3 text-sm transition ${t[0]===selectedType?'border-purple-500 bg-purple-500/10':''}">${t[1]}</button>`).join('');
        }
        function pickType(t){ selectedType=t; renderGenTypes(); }

        let currentBrief = null;
        async function parseReq(){
            const text = document.getElementById('genReq').value.trim();
            const box = document.getElementById('parseResult');
            const btn = document.getElementById('parseBtn');
            if(!text){ box.innerHTML = '<div class="text-sm text-amber-400">请先输入需求描述。</div>'; return; }
            btn.disabled = true; btn.classList.add('opacity-60');
            box.innerHTML = '<div class="text-sm text-gray-400 flex items-center gap-2"><span class="spinner"></span> 正在解析需求...</div>';
            try {
                const resp = await fetch('/api/parse-requirement', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ requirement: text })
                });
                const j = await resp.json();
                if(!j.ok) throw new Error(j.error||'解析失败');
                currentBrief = j;
                document.getElementById('genPark').value = j.parkId;
                const chips = (arr,cls)=> (arr||[]).map(x=>`<span class="${cls} px-2 py-0.5 rounded-full text-xs mr-1 mb-1 inline-block">${x}</span>`).join('');
                box.innerHTML = `<div class="bg-purple-500/10 border border-purple-500/30 rounded-lg p-4 text-sm">
                    <div class="font-bold text-purple-300 mb-2">${j.icon} 已识别：${j.parkName} <span class="text-xs text-gray-400">（置信度 ${j.confidence}%）</span></div>
                    ${j.client?`<div class="text-gray-300 mb-1">客户主体：<span class="text-pink-300">${j.client}</span></div>`:''}
                    ${j.emphases.length?`<div class="mb-1">核心诉求：${chips(j.emphases,'bg-pink-500/20 text-pink-300')}</div>`:''}
                    ${j.focusScenarios.length?`<div class="mb-1">重点场景：${chips(j.focusScenarios,'bg-purple-500/20 text-purple-300')}</div>`:''}
                    <div class="text-gray-400 text-xs mt-2">${j.understanding}</div>
                    <div class="text-green-300 text-xs mt-2">✓ 已自动选定园区，生成时将按此需求定制内容</div>
                </div>`;
            } catch(err){
                box.innerHTML = `<div class="text-sm text-red-400">❌ ${err.message}</div>`;
            } finally {
                btn.disabled = false; btn.classList.remove('opacity-60');
            }
        }
        function showPark(id){
            const p = parks.find(x=>x.id===id);
            document.getElementById('modalContent').innerHTML = `
                <div class="text-6xl mb-4 text-center">${p.icon}</div>
                <h3 class="text-2xl font-bold mb-2 text-center">${p.name}</h3>
                <p class="text-gray-400 text-center mb-6">${p.desc}</p>
                <div class="grid grid-cols-2 gap-3 mb-4 text-sm"><div class="bg-slate-900 rounded-lg p-3 text-center">📁 ${p.res} 个资源</div><div class="bg-slate-900 rounded-lg p-3 text-center">✅ ${p.tag}</div></div>
                <div class="text-sm font-semibold mb-2">核心功能模块:</div>
                <div class="flex flex-wrap gap-2">${p.modules.map(m=>`<span class="bg-purple-500/20 text-purple-300 px-3 py-1 rounded-full text-xs">${m}</span>`).join('')}</div>`;
            document.getElementById('parkModal').classList.add('active');
        }

        async function generate(){
            const parkId = document.getElementById('genPark').value;
            const p = parks.find(x=>x.id===parkId);
            const ver = document.querySelector('input[name=ver]:checked').value;
            const requirement = document.getElementById('genReq').value.trim();
            const t = genTypes.find(t=>t[0]===selectedType);
            const typeName = t[1], endpoint = t[2], ext = t[3];
            const r = document.getElementById('genResult');
            const btn = document.getElementById('genBtn');
            btn.disabled = true; btn.classList.add('opacity-60');
            const tip = requirement ? '（按需求定制）' : '';
            r.innerHTML = `<div class="bg-slate-900 border border-purple-500/30 rounded-lg p-4 text-gray-300 flex items-center gap-3"><span class="spinner"></span> 正在为「${p.name}」生成${typeName}（${ver}）${tip}并下载...</div>`;
            try {
                const payload = { parkId, version: ver };
                if (requirement) payload.requirement = requirement;
                const resp = await fetch(`/api/generate/${endpoint}`, {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify(payload)
                });
                if(!resp.ok){
                    let msg = 'HTTP '+resp.status;
                    try { const j = await resp.json(); msg = j.error + (j.detail? '：'+j.detail : ''); } catch(e){}
                    throw new Error(msg);
                }
                const blob = await resp.blob();
                const fileName = `${p.name}-${typeName.replace(/^.. /,'')}-${ver}.${ext}`;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = fileName;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a);
                setTimeout(()=>URL.revokeObjectURL(url), 4000);
                const sizeKB = (blob.size/1024).toFixed(1);
                r.innerHTML = `<div class="bg-green-500/10 border border-green-500/30 rounded-lg p-5">
                    <div class="font-bold text-green-300 mb-3">✅ 生成成功，文件已开始下载！</div>
                    <div class="text-sm text-gray-300 mb-3">${p.icon} ${p.name} · ${ver}</div>
                    <div class="flex items-center justify-between bg-slate-900 rounded-lg px-4 py-2"><span class="text-sm">📄 ${fileName}</span><span class="text-xs text-purple-400">${sizeKB} KB</span></div>
                    <p class="text-xs text-gray-500 mt-3">若浏览器未自动下载，请检查弹窗拦截设置。</p>
                </div>`;
            } catch(err){
                r.innerHTML = `<div class="bg-red-500/10 border border-red-500/30 rounded-lg p-5">
                    <div class="font-bold text-red-300 mb-2">❌ 生成失败</div>
                    <div class="text-sm text-gray-300">${err.message}</div>
                    <p class="text-xs text-gray-500 mt-2">请确认后端服务运行正常，或稍后重试。</p>
                </div>`;
            } finally {
                btn.disabled = false; btn.classList.remove('opacity-60');
            }
        }
        renderParks(); renderPhases(); renderGenTypes();
    </script>
</body>
</html>
