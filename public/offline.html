<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0D">
  <title>离线 · 云TB百科全书</title>
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    :root{ --gold:#D6A84F; --gold2:#F5D78E; --ink:#0B0B0D; --panel:#14110E; }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
      background:radial-gradient(1200px 600px at 50% -10%,#1b160f 0%,var(--ink) 60%);
      color:#f4ecda; display:flex; align-items:center; justify-content:center;
      min-height:100vh; padding:24px; text-align:center;
      -webkit-tap-highlight-color:transparent;
    }
    .card{ max-width:420px; width:100%; }
    .logo{
      width:104px; height:104px; margin:0 auto 22px; border-radius:26px;
      background:linear-gradient(160deg,#211a10,#0d0b08);
      border:1px solid rgba(214,168,79,.35);
      box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 40px rgba(214,168,79,.08);
      display:flex; align-items:center; justify-content:center;
    }
    .logo img{ width:78px; height:78px; }
    h1{ font-size:22px; letter-spacing:1px; margin-bottom:10px;
      background:linear-gradient(90deg,var(--gold2),var(--gold));
      -webkit-background-clip:text; background-clip:text; color:transparent; }
    p{ color:#c9bfa8; line-height:1.7; font-size:15px; margin-bottom:8px; }
    .tip{ font-size:13px; color:#8a8069; margin-top:6px; }
    button{
      margin-top:26px; padding:13px 30px; font-size:16px; cursor:pointer;
      color:var(--ink); font-weight:700; letter-spacing:1px; border:none; border-radius:14px;
      background:linear-gradient(90deg,var(--gold2),var(--gold));
      box-shadow:0 10px 26px rgba(214,168,79,.28);
    }
    button:active{ transform:translateY(1px); }
    .dot{ display:inline-block; width:8px; height:8px; border-radius:50%;
      background:#e0574f; margin-right:8px; vertical-align:middle; box-shadow:0 0 10px #e0574f; }
    .status{ font-size:13px; color:#a89c82; margin-top:20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/icons/icon-192.png" alt="云TB百科"></div>
    <h1>网络暂时开小差</h1>
    <p>当前处于离线状态，无法加载最新内容。</p>
    <p class="tip">已缓存的页面仍可浏览；恢复联网后即可继续生成方案 / PPT / 报价。</p>
    <button onclick="location.reload()">重新连接</button>
    <div class="status"><span class="dot"></span><span id="net">离线</span></div>
  </div>
  <script>
    function upd(){
      var el=document.getElementById('net');
      if(navigator.onLine){ el.textContent='已联网，正在刷新…'; location.reload(); }
      else{ el.textContent='离线'; }
    }
    window.addEventListener('online', upd);
  </script>
</body>
</html>
